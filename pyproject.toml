[build-system]
# setuptools 77 is the first release that accepts the PEP 639 `license` expression below.
# The minimum is 84.1.0: releases from 38.2.2 up to 84.1.0 are affected by GHSA-xmj3-9gf7-h52w, and
# releases before 83.0.0 (including the earlier 80.9.0 pin) by GHSA-h35f-9h28-mq5c / CVE-2026-59890.
# Release builds use setuptools 84.2.1 (see beta/CI-PLAN.md).
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siftelo"
version = "0.1.0"
description = "Siftelo: clarity before action. A read-only preflight that checks whether an agent handoff still matches its Git repository. Not a sandbox for untrusted repositories."
readme = "README.md"
# SPDX expression (PEP 639). The copyright notice is in NOTICE (Copyright 2026 Marsh).
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
]
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.scripts]
siftelo = "siftelo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
